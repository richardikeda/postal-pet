name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (example: v0.5.3)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: pet-post
            java: '21'
          - project: pet-post-26.2
            java: '25'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: bash gradlew --no-daemon build
        working-directory: mods/${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.project }}
          path: mods/${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums and draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release-files
          sha256sum *.jar > SHA256SUMS
          gh release create "$RELEASE_TAG" *.jar SHA256SUMS --verify-tag --draft --title "Postal Pet $RELEASE_TAG" --notes "See docs/testing.md for validation status. Select the JAR matching your Minecraft version."
