name: Postal Pet CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: build-${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21'
            project: pet-post
            java: '21'
          - minecraft: '26.2'
            project: pet-post-26.2
            java: '25'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Build and checks
        working-directory: mods/${{ matrix.project }}
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postal-pet-${{ matrix.minecraft }}
          path: mods/${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
