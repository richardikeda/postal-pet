name: Postal Pet CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    name: build-${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21'
            project: pet-post
            java: '21'
          - minecraft: '26.2'
            project: pet-post-26.2
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and checks
        working-directory: mods/${{ matrix.project }}
        run: bash gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: postal-pet-${{ matrix.minecraft }}
          path: mods/${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
